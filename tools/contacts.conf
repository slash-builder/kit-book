# contacts.conf: the two addresses the community files name. The one place they are set.
#
#   CONDUCT_CONTACT    where Code of Conduct reports go (CODE_OF_CONDUCT.md, "Enforcement")
#   SECURITY_CONTACT   where vulnerability reports go when GitHub private vulnerability reporting is not an option (SECURITY.md)
#
# Both are EMPTY on purpose: the owner decides the addresses, and the mail setup is pending. While one is empty,
# tools/render-community.py writes the visible marker [CONTACT NOT SET] in its place and `make go-public-check` FAILS.
# After setting them: run `make community` (renders CODE_OF_CONDUCT.md and SECURITY.md), commit both files, then
# `make go-public-check`. Plain text, one NAME=value per line, no quotes.
CONDUCT_CONTACT=
SECURITY_CONTACT=
