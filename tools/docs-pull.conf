# docs-pull.conf: which of each Kit's own documentation pages tools/pull-docs.py copies into the book.
#
# One section per Kit, named as in kits.lock (a Kit without a section here is not pulled). INI format, read with
# Python's configparser, so there is nothing to install. Lists have one item per line, indented.
#
#   dest      Where the pages land, under book/. A Kit in the registry uses book/30-kits/<slug>/reference
#             (the catalog card then lists the pages). A Kit that is not in the registry has no card, so it
#             gets book/30-kits/<name>.
#   public    auto (default: use the visibility column of kits.lock), yes or no. A link in a pulled page to a file
#             that is not pulled becomes a GitHub URL at the pinned commit if the Kit is public, and plain text if not.
#   index     The Kit's own index page; it becomes index.md, followed by a generated table of every pulled page.
#   include   Source files to pull, relative to the Kit's root; * and ** work. Only Markdown.
#   exclude   Patterns removed from include.
#   order     Reading order in the table of contents, one source file per line, optionally "path | label" to
#             replace the page's own title in the contents. Pages not listed follow in alphabetical order.
#   title     Name used on the index page when the Kit has no index of its own (default: the section name).
#   nav_title The entry in book/SUMMARY.md that the pages nest under (default: "<name> reference").
#   home      Optional. A page under book/ (written relative to book/, with an optional #anchor) that stands in for the Kit's own
#             front door: a link in a pulled page to the Kit's root README.md or CONTRIBUTING.md goes there when the Kit is
#             private (a public Kit links to GitHub instead). Without it such a link becomes plain text.
#
# Pulled pages are committed, so readers need neither this file nor the Kits. See book/90-reference/make-targets.md#docs-pull.

[application-kit]
dest = book/30-kits/application-kit
public = auto
index = docs/README.md
nav_title = Application Kit reference (provisional name)
home = 30-kits/not-in-the-registry.md#application-kit-provisional-name
include =
    docs/*.md
    spec/APP-CONTEXT.md
    docs/examples/*/README.md
exclude =
    docs/README.md
order =
    docs/OVERVIEW.md
    docs/GETTING-STARTED.md
    docs/CONTEXT-GUIDE.md
    docs/VENUE-GUIDE.md
    docs/COORDINATION-GUIDE.md
    docs/TESTING.md
    docs/ARCHITECTURE.md
    docs/PLATFORMS.md
    docs/DESIGN-DECISIONS.md
    spec/APP-CONTEXT.md | The app context spec
    docs/examples/dart_cli/README.md | Example: dart_cli
    docs/examples/rust_cli/README.md | Example: rust_cli
    docs/examples/flutter_hello/README.md | Example: flutter_hello
