# kits.lock: the Kits this repository uses, each pinned to one commit.
#
# One line per Kit, five fields separated by spaces:
#   name   repo-url   commit   visibility   role
#
#   name        the folder it is fetched into: .kits/<name>/
#   repo-url    https://github.com/<org>/<repo>
#   commit      the full 40-character commit id (not a branch: pins do not move by themselves)
#   visibility  public  = downloaded with plain curl, no account needed
#               private = needs a GitHub login (`gh auth login`) or a GITHUB_TOKEN, and `make setup KITS=all`
#   role        core       a Kit this book documents; its own tests run in `make test`
#               app-dep    a Kit another Kit needs in order to build; fetched, not tested here
#               reference  a Kit documented in the book but not needed to build the apps
#
# To move a pin: `make lock` (see book/90-reference/make-targets.md).
# app-context-kit is public. storage-kit is still private: apps/notes_rust needs it and is skipped for anyone without access.
# The pin is the scrubbed single-commit release candidate (branch public/release-prep), the exact tree that will become public. The earlier
# private venue-kit pin is gone: the scrubbed Rust crate no longer depends on it.
# The pin is the commit the public repository starts from (its first and only commit on main).
app-context-kit https://github.com/slash-builder/app-context-kit 4797e81d83b0c1ef6cd297c947751680f302c7bd public core
# storage-kit is private for now, like app-context-kit; apps/notes_rust builds its Rust core against it (path dependency, so it is fetched, not tested here).
storage-kit https://github.com/slash-builder/storage-kit 369ba2211ff37df083b3689db7d2d0c141dd7ab1 private app-dep
