# Analyzer settings for the notes_rust demo app: the Flutter recommended lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by flutter_rust_bridge_codegen and committed (see README.md): do not edit, do not lint.
    - lib/src/rust/**
    # The vendored cargokit build tool and its glue package.
    - rust_builder/**
